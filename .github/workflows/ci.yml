name: Verify desktop source

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:config
      - run: node scripts/validate-config.cjs examples/hello-workspace/productview.yaml
      - run: npm test
      - run: npm test --prefix examples/hello-workspace
      - run: npm run build:demo
