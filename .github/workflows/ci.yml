name: Verify desktop source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        if: matrix.os != 'windows-latest'
      - run: npm ci
        if: matrix.os == 'windows-latest'
      - name: Download verified Electron archives through GitHub API
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = node -p "require('./node_modules/electron/package.json').version"
          $release = Invoke-RestMethod "https://api.github.com/repos/electron/electron/releases/tags/v$version"
          New-Item -ItemType Directory -Force windows-electron-cache | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            $name = "electron-v$version-win32-$arch.zip"
            $asset = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset) { throw "Electron release asset missing: $name" }
            $file = Join-Path windows-electron-cache $name
            Invoke-WebRequest -Uri $asset.url -Headers @{ Accept = 'application/octet-stream' } -OutFile $file
            $env:ELECTRON_ASSET_NAME = $name
            $expected = node -p "require('./node_modules/electron/checksums.json')[process.env.ELECTRON_ASSET_NAME]"
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Electron archive checksum mismatch: $name" }
          }
      - name: Download verified icon toolset through GitHub API
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/electron-userland/electron-builder-binaries/releases/tags/icons%401.2.3'
          $asset = $release.assets | Where-Object { $_.name -eq 'icons-bundle.tar.gz' } | Select-Object -First 1
          if (-not $asset) { throw 'Icon toolset release asset missing' }
          $archive = Join-Path $env:RUNNER_TEMP 'icons-bundle.tar.gz'
          Invoke-WebRequest -Uri $asset.url -Headers @{ Accept = 'application/octet-stream' } -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '4e5bb546c9d3ab0c2bbacc22857467bf415f742a34c2be9dd138779d2fc066f9') {
            throw 'Icon toolset checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'icons-toolset'
          New-Item -ItemType Directory -Force $destination | Out-Null
          tar -xzf $archive -C $destination
          $toolset = Join-Path $destination 'icons-bundle'
          if (-not (Test-Path (Join-Path $toolset 'icon-tool.js'))) { throw 'Icon toolset is incomplete' }
          "ELECTRON_BUILDER_ICONS_TOOLSET_DIR=$toolset" >> $env:GITHUB_ENV
      - run: npm run validate:config
      - run: node scripts/validate-config.cjs examples/hello-workspace/.projectroom/project.yaml
      - run: npm test
      - name: Package unsigned Windows app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run package:win:app -- --config.electronDist=windows-electron-cache
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $attempt)
          }
      - name: Build unsigned Windows test installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run package:win:unsigned -- --config.electronDist=windows-electron-cache
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $attempt)
          }
      - name: Stage Windows test installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $output = node -p 'require("node:path").resolve(require("./package.json").build.directories.output)'
          $installer = Join-Path $output 'Project-Room-Desktop-windows.exe'
          if (-not (Test-Path $installer)) { throw 'Windows test installer is missing' }
          New-Item -ItemType Directory -Force -Path windows-test-installer | Out-Null
          Copy-Item $installer windows-test-installer/
      - name: Keep Windows test installer on this CI run
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unsigned-test-installer
          path: windows-test-installer/Project-Room-Desktop-windows.exe
          if-no-files-found: error
          retention-days: 14
      - run: npm test --prefix examples/hello-workspace
      - run: npm run build:demo
