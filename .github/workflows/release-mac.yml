name: Release desktop apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: vars.APPLE_SIGNING_READY == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Check version and signing configuration
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')" || { echo 'Tag and package version differ'; exit 1; }
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
      - run: npm ci
      - run: npm run validate:config
      - run: npm test
      - name: Prepare notarization key for electron-builder 26
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          key_file="$RUNNER_TEMP/project-room-notarization-key.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_file"
          chmod 600 "$key_file"
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        run: npm run package:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/project-room-notarization-key.p8"
      - name: Verify signed release artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARTIFACT_DIR="$(node -p 'require("node:path").resolve(require("./package.json").build.directories.output)')"
          test -f "$ARTIFACT_DIR/latest-mac.yml"
          test -s "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.zip"
          test -s "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.dmg"
          codesign --verify --deep --strict --verbose=2 "$ARTIFACT_DIR/mac-arm64/Project Room.app"
          signed_team_id="$(codesign -dv --verbose=4 "$ARTIFACT_DIR/mac-arm64/Project Room.app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          test "$signed_team_id" = "$APPLE_TEAM_ID" || { echo 'Signed app Team ID does not match APPLE_TEAM_ID'; exit 1; }
          spctl --assess --verbose --type exec "$ARTIFACT_DIR/mac-arm64/Project Room.app"
          xcrun stapler validate "$ARTIFACT_DIR/mac-arm64/Project Room.app"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_DIR="$(node -p 'require("node:path").resolve(require("./package.json").build.directories.output)')"
          gh release create "$GITHUB_REF_NAME" \
            "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.dmg" \
            "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.zip" \
            "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.zip.blockmap" \
            "$ARTIFACT_DIR/latest-mac.yml" \
            --verify-tag --generate-notes --latest

  windows:
    needs: release
    if: vars.WINDOWS_SIGNING_READY == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Check version and signing configuration
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$(node -p 'require("./package.json").version')") { throw 'Tag and package version differ' }
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw 'Windows signing secrets are missing' }
      - run: npm ci
      - run: npm run validate:config
      - run: npm test
      - name: Build signed Windows installer
        run: npm run package:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $out = (Resolve-Path '../../outputs/project-room-desktop').Path
          $installer = Join-Path $out 'Project-Room-Desktop-x64-windows.exe'
          if (-not (Test-Path $installer) -or -not (Test-Path (Join-Path $out 'latest.yml'))) { throw 'Windows release artifacts are missing' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status)" }
      - name: Add Windows installer to the same GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = (Resolve-Path '../../outputs/project-room-desktop').Path
          gh release upload $env:GITHUB_REF_NAME (Join-Path $out 'Project-Room-Desktop-x64-windows.exe') (Join-Path $out 'Project-Room-Desktop-x64-windows.exe.blockmap') (Join-Path $out 'latest.yml') --clobber
