name: Release desktop apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: vars.APPLE_SIGNING_READY == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Check version and signing configuration
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')" || { echo 'Tag and package version differ'; exit 1; }
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
          done
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run validate:config
      - run: npm test
      - name: Prepare notarization key for electron-builder 26
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          key_file="$RUNNER_TEMP/project-room-notarization-key.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_file"
          chmod 600 "$key_file"
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        run: npm run package:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/project-room-notarization-key.p8"
      - name: Verify signed release artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARTIFACT_DIR="$(node -p 'require("node:path").resolve(require("./package.json").build.directories.output)')"
          test -f "$ARTIFACT_DIR/latest-mac.yml"
          test -s "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.zip"
          test -s "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.dmg"
          codesign --verify --deep --strict --verbose=2 "$ARTIFACT_DIR/mac-arm64/Project Room.app"
          signed_team_id="$(codesign -dv --verbose=4 "$ARTIFACT_DIR/mac-arm64/Project Room.app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          test "$signed_team_id" = "$APPLE_TEAM_ID" || { echo 'Signed app Team ID does not match APPLE_TEAM_ID'; exit 1; }
          spctl --assess --verbose --type exec "$ARTIFACT_DIR/mac-arm64/Project Room.app"
          xcrun stapler validate "$ARTIFACT_DIR/mac-arm64/Project Room.app"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_DIR="$(node -p 'require("node:path").resolve(require("./package.json").build.directories.output)')"
          gh release create "$GITHUB_REF_NAME" \
            "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.dmg" \
            "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.zip" \
            "$ARTIFACT_DIR/Project-Room-Desktop-arm64-mac.zip.blockmap" \
            "$ARTIFACT_DIR/latest-mac.yml" \
            --verify-tag --generate-notes --latest

  windows:
    needs: release
    if: vars.WINDOWS_SIGNING_READY == 'true'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Check version and signing configuration
        id: win-version
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $version = node -p 'require("./package.json").version'
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
            if (-not (Get-Item "Env:$name").Value) { throw "Missing SignPath setting: $name" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run validate:config
      - run: npm test
      - name: Build unsigned Windows installer
        run: npm run package:win:unsigned
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload unsigned installer for SignPath
        id: unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-room-windows-unsigned
          path: ../../outputs/project-room-desktop/Project-Room-Desktop-windows.exe
          if-no-files-found: error
          retention-days: 7
      - name: Request SignPath Foundation signature
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath-signed
          parameters: |
            version: "${{ steps.win-version.outputs.version }}"
      - name: Stage and verify signed installer
        shell: pwsh
        run: |
          $out = (Resolve-Path '../../outputs/project-room-desktop').Path
          $installer = Join-Path $out 'Project-Room-Desktop-windows.exe'
          $signed = @(Get-ChildItem "$env:RUNNER_TEMP/signpath-signed" -Recurse -File -Filter 'Project-Room-Desktop-windows.exe')
          if ($signed.Count -ne 1) { throw "Expected exactly one signed installer, found $($signed.Count)" }
          Copy-Item $signed[0].FullName $installer -Force
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw "Unexpected signer: $($signature.SignerCertificate.Subject)" }
          $versionInfo = (Get-Item $installer).VersionInfo
          if ($versionInfo.ProductName -ne 'Project Room') { throw "Unexpected product: $($versionInfo.ProductName)" }
          if ($versionInfo.ProductVersion -notlike "${{ steps.win-version.outputs.version }}*") { throw "Unexpected product version: $($versionInfo.ProductVersion)" }
      - name: Refresh update metadata for signed bytes
        shell: pwsh
        run: |
          $out = (Resolve-Path '../../outputs/project-room-desktop').Path
          node scripts/refresh-windows-update-metadata.cjs $out
          if ($LASTEXITCODE -ne 0) { throw 'Windows update metadata refresh failed' }
          foreach ($name in @('Project-Room-Desktop-windows.exe.blockmap', 'latest.yml')) {
            if (-not (Test-Path (Join-Path $out $name))) { throw "Missing Windows update artifact: $name" }
          }
      - name: Add Windows installer to the same GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = (Resolve-Path '../../outputs/project-room-desktop').Path
          gh release upload $env:GITHUB_REF_NAME (Join-Path $out 'Project-Room-Desktop-windows.exe') (Join-Path $out 'Project-Room-Desktop-windows.exe.blockmap') (Join-Path $out 'latest.yml') --clobber
