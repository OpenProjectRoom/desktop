name: Probe release downloads

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public release assets
        shell: bash
        run: |
          set -u
          for item in \
            'v0.9.84/latest-mac.yml' \
            'v0.9.84/download-probe-v0.9.84.yml' \
            'v0.9.80/latest-mac.yml' \
            'v0.9.78-windows-preview.1/Project-Room-Desktop-windows.exe'; do
            url="https://github.com/OpenProjectRoom/desktop/releases/download/$item"
            status="$(curl -L -I --max-time 25 -sS -o /dev/null -w '%{http_code}' "$url")"
            echo "$item HTTP $status"
          done
          curl -L --max-time 25 -fsS \
            -o latest-mac-probe.yml \
            'https://github.com/OpenProjectRoom/desktop/releases/download/v0.9.84/latest-mac.yml'
          test "$(wc -c < latest-mac-probe.yml)" -eq 531
          echo "v0.9.84/latest-mac.yml GET bytes $(wc -c < latest-mac-probe.yml)"
          curl -L --max-time 25 -fsS -r 0-1023 \
            -o mac-zip-probe.bin \
            'https://github.com/OpenProjectRoom/desktop/releases/download/v0.9.84/Project-Room-Desktop-arm64-mac.zip'
          echo "v0.9.84/mac.zip GET bytes $(wc -c < mac-zip-probe.bin)"
